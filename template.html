<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수도권 임대 공고 캘린더</title>
<style>
:root{
  --bg:#eef2f4; --panel:#ffffff; --ink:#15262e; --sub:#5b6b73; --line:#d5dde1;
  --seoul:#0b7a85; --gg:#4558b8; --ic:#a8680f; --soon:#c4312b;
  color-scheme:light;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1a1f; --panel:#17252c; --ink:#e6eef1; --sub:#98a9b0; --line:#2b3d46;
    --seoul:#4cc3cf; --gg:#8d9cf0; --ic:#e3a653; --soon:#ff7b73; color-scheme:dark;}
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 "Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;padding:0 0 48px}
main{max-width:1040px;margin:0 auto;padding:28px 16px 0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--seoul);outline-offset:2px}

.next{margin:0 0 6px;font-size:14px;color:var(--sub)}
.next b{color:var(--ink)}
.next .d{color:var(--soon);font-weight:700}
h1{margin:0;font-size:clamp(34px,7vw,56px);line-height:1.1;letter-spacing:-.03em;font-weight:800}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:18px 0 12px}
.chips,.nav{display:flex;gap:6px;flex-wrap:wrap}
.chip,.nav button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px}
.sep{width:10px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nav button{border-radius:8px;min-width:40px}

.cal{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:8px 6px;text-align:center;font-size:13px;color:var(--sub);border-bottom:1px solid var(--line)}
.dow div:first-child,.day:nth-child(7n+1) .n{color:var(--soon)}
.day{min-height:96px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{background:color-mix(in srgb,var(--bg) 55%,transparent)}
.day .n{font-size:13px;color:var(--sub);padding:0 3px}
.day.today .n{display:inline-block;align-self:flex-start;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 7px;font-weight:700}
.ev{border:0;text-align:left;border-radius:4px;padding:1px 5px;font-size:12px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.ev.start{background:var(--c);color:#fff;font-weight:600}
.ev.end{background:transparent;border:1px solid var(--c);color:var(--c)}
.ev.posted{background:transparent;border:1px dashed var(--sub);color:var(--sub)}
.ev.mid{height:5px;padding:0;background:color-mix(in srgb,var(--c) 35%,transparent);border-radius:2px}
.more{font-size:12px;color:var(--sub);padding:0 4px}
.seoul{--c:var(--seoul)} .gg{--c:var(--gg)} .ic{--c:var(--ic)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--sub);font-size:13px;margin:10px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

h2{margin:32px 0 10px;font-size:20px;letter-spacing:-.02em}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.row{width:100%;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:10px 12px}
.dd{font-weight:800;font-size:18px;text-align:center}
.dd.soon{color:var(--soon)}
.dd small{display:block;font-weight:400;font-size:11px;color:var(--sub)}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--sub)}
.empty{padding:22px;border:1px dashed var(--line);border-radius:8px;color:var(--sub);text-align:center}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:min(520px,92vw);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 10px;font-size:18px;line-height:1.4;overflow-wrap:anywhere}
dialog dl{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;margin:0 0 16px}
dialog dt{color:var(--sub)} dialog dd{margin:0}
.actions{display:flex;gap:8px;justify-content:flex-end}
.btn{border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--panel);text-decoration:none;color:inherit}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{color:var(--soon);font-size:13px;margin:-6px 0 14px}
footer{margin-top:28px;color:var(--sub);font-size:13px}
footer .chip{margin-top:10px;font-size:13px}
.tag{font-size:11px;font-weight:700;color:var(--bg);background:var(--seoul);border-radius:4px;padding:0 5px;margin-right:4px;vertical-align:1px}
.hint{color:var(--sub);font-size:13px;margin:0 0 10px}
dialog textarea{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px;margin-bottom:14px}

@media (max-width:640px){
  main{padding-top:20px}
  .day{min-height:74px;padding:2px}
  .ev{font-size:10.5px;padding:0 3px}
  .row{grid-template-columns:52px 1fr}
}
</style>
</head>
<body>
<main>
  <p class="next" id="next"></p>
  <h1 id="month"></h1>

  <div class="bar">
    <div class="chips" id="chips" role="group" aria-label="지역 필터"></div>
    <div class="nav">
      <button id="prev" aria-label="이전 달">‹</button>
      <button id="now">오늘</button>
      <button id="nextm" aria-label="다음 달">›</button>
    </div>
  </div>

  <div class="cal">
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="legend">
    <span><i style="background:var(--seoul)"></i>서울</span>
    <span><i style="background:var(--gg)"></i>경기</span>
    <span><i style="background:var(--ic)"></i>인천</span>
    <span>채워진 칸: 접수 시작 · 테두리: 접수 마감 · 점선: 접수일 확인 필요(공고일)</span>
  </div>

  <h2>접수 예정·진행 중</h2>
  <ul class="list" id="list"></ul>

  <footer><span id="foot"></span><br><button class="chip" id="bkOpen">지원 표시 백업·복원</button></footer>
</main>

<dialog id="dlg">
  <h3 id="dT"></h3>
  <dl id="dD"></dl>
  <p class="note" id="dN" hidden>접수 시작일을 자동으로 읽지 못했어요. 원문에서 일정을 확인하세요.</p>
  <div class="actions">
    <button class="btn" id="dA"></button>
    <button class="btn" id="dX">닫기</button>
    <a class="btn main" id="dL" target="_blank" rel="noopener">공고 원문 보기</a>
  </div>
</dialog>

<dialog id="dlg2">
  <h3>지원 표시 백업·복원</h3>
  <p class="hint">지원 표시는 이 브라우저에만 저장돼요. 다른 기기에서 쓰려면 아래 코드를 복사해 그 기기의 이 화면에 붙여넣고 복원하세요. 복원하면 기존 표시에 더해져요.</p>
  <textarea id="bk" rows="4" spellcheck="false"></textarea>
  <div class="actions">
    <button class="btn" id="bkX">닫기</button>
    <button class="btn main" id="bkR">복원</button>
  </div>
</dialog>

<script>
const DATA = /*DATA*/[];
const META = /*META*/{};
const KW = (META.keywords || []).join('·') || '전체';
const CLS = {서울:'seoul', 경기:'gg', 인천:'ic'};
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const iso = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const T = new Date();
const TODAY = iso(T.getFullYear(), T.getMonth(), T.getDate());
const days = (a,b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const ddText = r => { const n = days(TODAY, r.start); return n === 0 ? '오늘' : n > 0 ? 'D-' + n : 'D+' + (-n); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let view = {y: T.getFullYear(), m: T.getMonth()};
let region = '전체';
let org = '전체';
let mode = 'match';   // match(맞춤) | all(전체) | applied(지원한 공고)
let curId = null;
const LS_KEY = 'cheongyak-applied';
let applied = new Set();
try { applied = new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]')); } catch (e) {}
const saveApplied = () => { try { localStorage.setItem(LS_KEY, JSON.stringify([...applied])); } catch (e) {} };
const nm = r => (applied.has(r.id) ? '✓ ' : '') + r.name;
const byId = Object.fromEntries(DATA.map(r => [r.id, r]));
const shown = () => DATA.filter(r => (region === '전체' || r.region === region) && (org === '전체' || r.org === org)
  && (mode === 'all' || (mode === 'match' ? r.match : applied.has(r.id))));

function renderChips(){
  const btn = (k, v, cur) => `<button class="chip" data-${k}="${v}" aria-pressed="${v === cur}">${v}</button>`;
  $('#chips').innerHTML = ['전체','서울','경기','인천'].map(n => btn('r', n, region)).join('')
    + '<span class="sep"></span>'
    + ['전체','LH','SH'].map(n => btn('o', n, org)).join('')
    + '<span class="sep"></span>'
    + [['match', '맞춤 공고'], ['all', '전체 공고'], ['applied', `지원한 공고 ${DATA.filter(r => applied.has(r.id)).length}`]].map(([v, l]) =>
        `<button class="chip" data-m="${v}" aria-pressed="${v === mode}">${l}</button>`).join('');
}

function renderNext(){
  const up = shown().filter(r => r.start && r.start >= TODAY).sort((a,b) => a.start.localeCompare(b.start))[0];
  $('#next').innerHTML = up
    ? `다음 접수 시작 <b>${esc(up.name)}</b> <span class="d">${ddText(up)}</span> (${up.start})`
    : '예정된 접수 시작 공고가 없어요.';
}

function renderGrid(){
  $('#month').textContent = `${view.y}년 ${view.m + 1}월`;
  const first = new Date(view.y, view.m, 1).getDay();
  const total = new Date(view.y, view.m + 1, 0).getDate();
  const cells = Math.ceil((first + total) / 7) * 7;
  const list = shown();
  let html = '';
  for (let i = 0; i < cells; i++){
    const d = i - first + 1;
    if (d < 1 || d > total){ html += '<div class="day out"></div>'; continue; }
    const k = iso(view.y, view.m, d), ev = [];
    for (const r of list){
      const c = CLS[r.region] || 'seoul';
      if (r.start === k) ev.push(`<button class="ev start ${c}" data-id="${esc(r.id)}" title="${esc(r.name)}">${esc(nm(r))}</button>`);
      else if (r.end === k && r.start) ev.push(`<button class="ev end ${c}" data-id="${esc(r.id)}" title="마감 · ${esc(r.name)}">마감 ${esc(nm(r))}</button>`);
      else if (!r.start && r.posted === k) ev.push(`<button class="ev posted ${c}" data-id="${esc(r.id)}" title="${esc(r.name)}">${esc(nm(r))}</button>`);
      else if (r.start && r.end && r.start < k && k < r.end) ev.push(`<button class="ev mid ${c}" data-id="${esc(r.id)}" title="${esc(r.name)}" aria-label="${esc(r.name)} 접수 중"></button>`);
    }
    const bars = ev.filter(e => e.includes('class="ev mid')), main = ev.filter(e => !e.includes('class="ev mid'));
    const vis = main.slice(0, 3);
    html += `<div class="day${k === TODAY ? ' today' : ''}"><span class="n">${d}</span>${vis.join('')}${main.length > 3 ? `<span class="more">+${main.length - 3}</span>` : ''}${bars.slice(0,3).join('')}</div>`;
  }
  $('#grid').innerHTML = html;
}

function renderList(){
  const rows = shown().filter(r => (r.end || r.start || r.posted || '9999') >= TODAY)
    .sort((a,b) => (a.start || '9999' + a.posted).localeCompare(b.start || '9999' + b.posted));
  $('#list').innerHTML = rows.length ? rows.map(r => {
    const c = CLS[r.region] || 'seoul';
    const dd = r.start ? `<div class="dd${days(TODAY, r.start) >= 0 && days(TODAY, r.start) <= 1 ? ' soon' : ''}">${ddText(r)}<small>접수 시작</small></div>`
                       : `<div class="dd"><small>일정 확인</small></div>`;
    const per = r.start ? `${r.start} ~ ${r.end || '?'}` : `공고일 ${r.posted || '?'}`;
    return `<li><button class="row ${c}" data-id="${esc(r.id)}">${dd}<div><div class="t">${applied.has(r.id) ? '<b class="tag">지원함</b>' : ''}${esc(r.name)}</div><div class="s">${esc(r.org)} · ${esc(r.region)} · ${esc(r.type)} · ${per}</div></div></button></li>`;
  }).join('') : `<li class="empty">${mode === 'applied' ? '지원한 공고로 표시한 공고가 없어요. 공고를 눌러 \'지원함으로 표시\'를 선택하세요.' : mode === 'match' ? `맞춤 공고(${KW})가 아직 없어요. \'전체 공고\'로 바꾸면 다른 공고도 볼 수 있어요.` : '표시할 공고가 없어요. 필터를 바꾸거나 다음 갱신을 기다려 주세요.'}</li>`;
}

function openDlg(id){
  const r = byId[id]; if (!r) return;
  $('#dT').textContent = r.name;
  $('#dD').innerHTML = [['기관', r.org], ['지역', r.region], ['유형', r.type], ['상태', r.status || '-'],
    ['공고일', r.posted || '-'], ['접수기간', r.start ? `${r.start} ~ ${r.end || '?'}` : '확인 필요']]
    .map(([a,b]) => `<dt>${a}</dt><dd>${esc(b)}</dd>`).join('');
  $('#dN').hidden = !!r.start;
  $('#dL').href = r.url;
  curId = id;
  $('#dA').textContent = applied.has(id) ? '지원 표시 해제' : '지원함으로 표시';
  $('#dlg').showModal();
}

function renderFoot(){
  const n = DATA.filter(r => applied.has(r.id)).length;
  $('#foot').textContent = META.updated ? `맞춤 키워드 ${KW} · 맞춤 ${DATA.filter(r => r.match).length}건 / 전체 ${DATA.length}건 · 지원 표시 ${n}건 · 마지막 갱신 ${META.updated} (KST) · 데이터 출처: LH 청약플러스(공공데이터포털), SH(서울주거포털). 접수 일정은 반드시 공고 원문에서 다시 확인하세요.` : '';
}
function renderAll(){ renderChips(); renderNext(); renderGrid(); renderList(); renderFoot(); }
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (chip){ if (chip.dataset.m) mode = chip.dataset.m; else if (chip.dataset.o) org = chip.dataset.o; else region = chip.dataset.r; renderAll(); return; }
  const ev = e.target.closest('[data-id]'); if (ev) openDlg(ev.dataset.id);
});
const shift = n => { const d = new Date(view.y, view.m + n, 1); view = {y: d.getFullYear(), m: d.getMonth()}; renderGrid(); };
$('#prev').onclick = () => shift(-1);
$('#nextm').onclick = () => shift(1);
$('#now').onclick = () => { view = {y: T.getFullYear(), m: T.getMonth()}; renderGrid(); };
$('#dX').onclick = () => $('#dlg').close();
$('#dA').onclick = () => {
  if (!curId) return;
  applied.has(curId) ? applied.delete(curId) : applied.add(curId);
  saveApplied();
  $('#dA').textContent = applied.has(curId) ? '지원 표시 해제' : '지원함으로 표시';
  renderAll();
};
$('#bkOpen').onclick = () => { $('#bk').value = JSON.stringify([...applied]); $('#dlg2').showModal(); };
$('#bkX').onclick = () => $('#dlg2').close();
$('#bkR').onclick = () => {
  try {
    const arr = JSON.parse($('#bk').value);
    if (!Array.isArray(arr)) throw new Error('not array');
    arr.filter(x => typeof x === 'string').forEach(x => applied.add(x));
    saveApplied(); renderAll(); $('#dlg2').close();
  } catch (e) { $('#bk').value = '복원 코드가 올바르지 않아요. 백업한 코드를 그대로 붙여넣어 주세요.'; }
};
$('#dlg2').addEventListener('click', e => { if (e.target === $('#dlg2')) $('#dlg2').close(); });
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });
renderAll();
</script>
</body>
</html>
