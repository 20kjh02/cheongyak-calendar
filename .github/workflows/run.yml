name: 청약 알림

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 (한국 시간)
  workflow_dispatch:
    inputs:
      test_mail:
        description: "테스트 메일 발송"
        type: boolean
        default: false
      debug:
        description: "API 응답 원문 저장 (필드 확인용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cheongyak
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 공고 수집 및 알림
        env:
          LH_API_KEY: ${{ secrets.LH_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          CAL_URL: https://20kjh02.github.io/cheongyak-calendar/
        run: python fetch_notices.py ${{ inputs.debug && '--debug' || '' }} ${{ inputs.test_mail && '--test-mail' || '' }}

      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push
